<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carteira</title>
<meta name="theme-color" content="#5DADEC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carteira">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Plataformas retro: céu, nuvens em píxeis, chão de relva em baixo. Painéis = placas de madeira clara com contorno escuro. Mascote original: o Mealheiro. */
:root{
  --sky1:#5DADEC; --sky2:#A9DCFF; --ink:#1B1B3A; --paper:#FFF8E7; --paper2:#FFEFC7; --edge:#1B1B3A;
  --coin:#FFC400; --coin2:#E09A00; --red:#E8453C; --green:#2EB85C; --grass:#46C35A; --dirt:#B5652B; --dirt2:#8E4A1C;
  --dim:#6B6390; --pink:#FF6FA8; --blue:#2F7DE1;
  --pixel:"Press Start 2P",ui-monospace,monospace; --crt:"VT323",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--sky1);color:var(--ink)}
body{font-family:var(--crt);font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums;min-height:100vh;
  padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) calc(150px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--sky1),var(--sky2) 70%) fixed}
.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;width:12px;height:12px;background:#fff;box-shadow:12px 0 #fff,24px 0 #fff,36px 0 #fff,12px -12px #fff,24px -12px #fff,-12px 0 #fff,48px 0 #fff,24px -24px #fff;opacity:.9;animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}
.wrap{max-width:540px;margin:0 auto;position:relative;z-index:1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:24px;color:var(--ink);background:#fff;border:3px solid var(--edge);border-radius:0;padding:8px 10px;width:100%;outline:none;min-width:0}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:64px;line-height:1.15}
:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.px{font-family:var(--pixel)}
.dim{color:var(--dim)} .up{color:var(--green)} .down{color:var(--red)}
.board{min-width:0;overflow:hidden;background:var(--paper);border:4px solid var(--edge);box-shadow:5px 5px 0 rgba(27,27,58,.85);padding:14px}
h2{font-family:var(--pixel);font-size:11px;color:#fff;text-shadow:2px 2px 0 var(--edge);margin:22px 0 10px;text-transform:uppercase;line-height:1.5;display:flex;justify-content:space-between;align-items:end;gap:8px}
h2 small{font-family:var(--crt);font-size:19px;text-shadow:none;color:var(--ink);background:rgba(255,255,255,.75);padding:0 6px;text-transform:none}
/* HUD */
header{min-width:0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:10px 0;display:grid;gap:10px;background:linear-gradient(var(--sky1) 80%,transparent)}
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;width:100%;text-align:left;background:var(--paper);border:4px solid var(--edge);padding:8px 10px;box-shadow:4px 4px 0 rgba(27,27,58,.85)}
.lvl{white-space:nowrap;font-family:var(--pixel);font-size:10px;background:var(--red);color:#fff;padding:6px;border:3px solid var(--edge)}
.xp .t{font-family:var(--pixel);font-size:7.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-bottom:5px}
.xpbar{display:block;height:12px;border:3px solid var(--edge);background:#fff;position:relative}
.xpbar i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--green) 0 6px,#23964a 6px 8px)}
.stat{font-family:var(--pixel);font-size:10px;white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabs button{font-family:var(--pixel);font-size:8.5px;padding:10px 2px;background:var(--paper);border:3px solid var(--edge);box-shadow:3px 3px 0 rgba(27,27,58,.85)}
.tabs button.on{background:var(--coin);}
.press:active,.tabs button:active,.chip:active,.block:active,.btn:active{transform:translate(3px,3px);box-shadow:none!important}
/* mascote */
.hero{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:center;margin-top:12px}
.hero canvas{width:88px;height:88px;image-rendering:pixelated;animation:hop 1.4s steps(2) infinite}
@keyframes hop{50%{transform:translateY(-6px)}}
.bubble{position:relative;background:#fff;padding:10px 12px;font-size:21px;border:4px solid var(--edge);box-shadow:4px 4px 0 rgba(27,27,58,.85)}
.bubble::before{content:"";position:absolute;left:-14px;top:24px;border:7px solid transparent;border-right-color:var(--edge)}
/* sem apostas */
.clean{display:grid;gap:12px;background:linear-gradient(var(--paper),var(--paper2))}
.clean .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.clean .big b{font-family:var(--pixel);font-size:30px;color:var(--green);text-shadow:3px 3px 0 var(--edge)}
.clean .big b.zero{color:var(--red)}
.saved{font-family:var(--pixel);font-size:11px;line-height:1.6}
.hp{height:22px;border:3px solid var(--edge);background:#fff;position:relative}
.hp i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--red) 0 8px,#b8302a 8px 10px)}
.hp.g i{background:repeating-linear-gradient(90deg,var(--green) 0 8px,#23964a 8px 10px)}
.hp.y i{background:repeating-linear-gradient(90deg,var(--coin) 0 8px,var(--coin2) 8px 10px)}
.hp span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--pixel);font-size:8px;color:#fff;text-shadow:2px 2px 0 var(--edge)}
.boss{display:flex;justify-content:space-between;gap:8px;align-items:center;font-family:var(--pixel);font-size:9px;line-height:1.5}
.goals{display:grid;gap:6px}
.goal{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:19px}
.goal .tr{grid-column:1/-1;height:8px;border:2px solid var(--edge);background:#fff}
.goal .tr i{display:block;height:100%;background:var(--coin)}
/* rápido */
.quick{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}
.btn{font-family:var(--pixel);font-size:10px;padding:0 14px;min-height:50px;background:var(--coin);border:4px solid var(--edge);box-shadow:4px 4px 0 rgba(27,27,58,.85)}
.btn.alt{background:var(--paper)} .btn.green{background:var(--green);color:#fff} .btn.small{min-height:36px;font-size:8px;padding:0 10px;border-width:3px;box-shadow:3px 3px 0 rgba(27,27,58,.85)}
.hint{font-size:18px;color:var(--ink);background:rgba(255,255,255,.6);padding:2px 6px;margin-top:6px;display:inline-block}
/* listas */
.row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:9px 10px;background:var(--paper);border:3px solid var(--edge);margin-bottom:6px}
.row.auto{background:#FFF3B8;border-color:var(--coin2)}
.row .ic{width:40px;height:40px;display:grid;place-items:center;font-size:20px;background:#fff;border:3px solid var(--edge)}
.row .t1{display:block;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{display:block;font-size:18px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-size:26px;white-space:nowrap;text-align:right}
.row .t3{display:block;font-size:18px;color:var(--ink);opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.find{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.find .btn{padding:0 14px}
.filt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}.filt select{font-size:20px;padding:6px 8px}
.found{font-family:var(--pixel);font-size:8.5px;color:#fff;text-shadow:2px 2px 0 var(--edge);padding:12px 2px 0;text-transform:uppercase}
.lim{display:grid;gap:6px;margin-bottom:12px}.lim:last-child{margin-bottom:0}.lim .lab{display:flex;justify-content:space-between;gap:8px;font-size:21px}
.lim .track{height:16px;background:#fff;border:3px solid var(--edge)}.lim .track i{display:block;height:100%}
.lim .sub{font-size:17px;color:var(--dim)}
.cmp{font-size:17px;color:var(--dim);margin-top:2px}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.tools .btn{min-height:44px;font-size:7.5px;padding:0 4px;line-height:1.5}
.favs{display:flex;gap:7px;overflow-x:auto;padding:4px 2px 8px;margin-top:8px;scrollbar-width:none}.favs::-webkit-scrollbar{display:none}
.fav{flex:none;font-size:20px;padding:6px 10px;background:#fff;border:3px solid var(--edge);box-shadow:3px 3px 0 rgba(27,27,58,.85);white-space:nowrap}.fav b{font-weight:400;color:var(--red)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cal .wd{font-family:var(--pixel);font-size:7px;text-align:center;color:var(--dim);padding:2px 0}
.cal button{aspect-ratio:1;min-width:0;border:2px solid var(--edge);background:#fff;display:grid;align-content:center;justify-items:center;line-height:1;padding:0;font-size:15px;position:relative}
.cal button b{font-weight:400;font-size:13px;opacity:.75}.cal button.td{outline:3px solid var(--blue);outline-offset:-1px}.cal button.fut{background:transparent;opacity:.5}.cal button em{position:absolute;top:-4px;right:-3px;font-size:11px;font-style:normal}
.calleg{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:16px}.calleg i{display:inline-block;width:12px;height:12px;border:2px solid var(--edge);margin-right:4px;vertical-align:-1px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:21px}.kv b{font-weight:400;text-align:right;white-space:nowrap}.kv .tot{border-top:3px solid var(--edge);padding-top:6px;margin-top:4px}
.sos{width:100%;background:var(--red);color:#fff;min-height:54px}
.sosclock{font-family:var(--pixel);font-size:44px;text-align:center;color:var(--red);text-shadow:3px 3px 0 var(--edge);padding:8px 0}
.callbtn{display:block;text-align:center;text-decoration:none;color:var(--ink)}
.wr{display:grid;gap:12px;text-align:center;padding:8px 0}.wr .em{font-size:56px}.wr .big{font-size:48px;line-height:1;color:var(--coin2);text-shadow:3px 3px 0 var(--edge)}.wr .px{font-size:11px;line-height:1.6}.wr p{font-size:22px;margin:0}
.dots{display:flex;justify-content:center;gap:6px}.dots i{width:10px;height:10px;border:2px solid var(--edge);background:#fff}.dots i.on{background:var(--coin)}
.pay{background:linear-gradient(#E9FFF0,#C9F5D6)}.pay .pr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:2px dashed rgba(27,27,58,.3)}.pay .pr:first-of-type{border-top:0}
.trip{background:linear-gradient(#EAF4FF,#CFE6FF)}
.rgrid{display:grid;grid-template-columns:1fr 1fr 110px;gap:6px;align-items:center}.rgrid select,.rgrid input{font-size:19px;padding:6px}
.off{opacity:.45}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.split div{background:var(--paper);border:3px solid var(--edge);padding:10px;box-shadow:3px 3px 0 rgba(27,27,58,.85);min-width:0}.split span{display:block;font-family:var(--pixel);font-size:7.5px;color:var(--dim);margin-bottom:6px}.split b{font-size:28px;font-weight:400;white-space:nowrap}
.inv{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;width:100%;text-align:left;background:var(--paper);border:4px solid var(--edge);box-shadow:4px 4px 0 rgba(27,27,58,.85);padding:12px;margin-bottom:10px}
.inv .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.inv .top span{font-size:23px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.inv .top b{font-size:32px;font-weight:400;white-space:nowrap}
.inv .sub{display:flex;justify-content:space-between;gap:8px;font-size:18px;color:var(--dim)}.inv .g{font-size:21px}
.limrow{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center}.limrow input{font-size:22px;text-align:right;padding:6px 8px}.limrow small{display:block;font-size:16px;color:var(--dim)}
.tag{font-family:var(--pixel);font-size:7px;padding:2px 4px;background:var(--coin);border:2px solid var(--edge);vertical-align:middle;margin-left:6px}
.day{display:flex;justify-content:space-between;font-family:var(--pixel);font-size:8.5px;color:#fff;text-shadow:2px 2px 0 var(--edge);padding:16px 2px 8px;text-transform:uppercase}
.quest{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--paper);border:3px solid var(--edge);margin-bottom:6px}
.quest .ck{width:28px;height:28px;border:3px solid var(--edge);background:#fff;display:grid;place-items:center;font-family:var(--pixel);font-size:10px}
.quest.done .ck{background:var(--green);color:#fff} .quest.done .qt{color:var(--dim);text-decoration:line-through}
.quest .rw{font-family:var(--pixel);font-size:8px;color:var(--coin2)}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.score div{background:var(--paper);border:3px solid var(--edge);padding:10px 8px;min-width:0;box-shadow:3px 3px 0 rgba(27,27,58,.85)}
.score span{display:block;font-family:var(--pixel);font-size:7.5px;color:var(--dim);margin-bottom:8px}
.score b{display:block;font-size:25px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.month{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0}
.month b{font-family:var(--pixel);font-size:11px;text-transform:uppercase;color:#fff;text-shadow:2px 2px 0 var(--edge)}
.arrow{font-family:var(--pixel);font-size:13px;width:44px;height:40px;display:grid;place-items:center;background:var(--paper);border:3px solid var(--edge);box-shadow:3px 3px 0 rgba(27,27,58,.85)}
.empty{text-align:center;padding:26px 12px;background:rgba(255,255,255,.7);border:3px dashed var(--edge)}
.empty .px{font-size:11px;display:block;margin-bottom:10px;line-height:1.6}
.hiscore{text-align:center;margin-top:14px}
.hiscore .px{font-size:9px;color:var(--red)}
.hiscore b{display:block;font-size:56px;font-weight:400;color:var(--coin2);text-shadow:3px 3px 0 var(--edge);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;background:var(--paper);border:3px solid var(--edge);margin-bottom:6px}
.acc i{width:14px;height:14px;display:block;border:2px solid var(--edge)}
.acc b{font-weight:400;font-size:26px;white-space:nowrap}
.bars{display:grid;gap:12px}
.bar .lab{display:flex;justify-content:space-between;gap:10px;font-size:21px}
.bar{min-width:0}.bar .lab span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.bar .lab span:last-child{white-space:nowrap}
.track{height:18px;background:#fff;border:3px solid var(--edge);margin-top:4px}
.fill{height:100%}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:160px}
.col{display:grid;grid-template-columns:1fr 1fr;gap:3px;align-items:end;height:100%}
.col i{display:block;min-height:2px;border:2px solid var(--edge)}
.collab{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px;font-family:var(--pixel);font-size:7.5px;text-align:center;text-transform:uppercase}
.legend{display:flex;gap:16px;font-size:19px;margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;border:2px solid var(--edge)}
.note{font-size:19px;color:var(--ink);margin-top:8px}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.badge{background:var(--paper);border:3px solid var(--edge);padding:10px 6px;text-align:center;display:grid;gap:6px;justify-items:center}
.badge em{font-style:normal;font-size:30px;line-height:1}
.badge b{font-family:var(--pixel);font-size:7px;line-height:1.5;font-weight:400}
.badge span{font-size:16px;color:var(--dim)}
.badge.lock{opacity:.45;filter:grayscale(1)} .badge.got{background:#FFF3B8}
/* chão + blocos */
.ground{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--grass) 0 12px,var(--edge) 12px 15px,var(--dirt) 15px);background-size:100% 100%;border-top:4px solid var(--edge)}
.ground::after{content:"";position:absolute;inset:15px 0 0;background-image:radial-gradient(var(--dirt2) 2px,transparent 3px);background-size:22px 18px;pointer-events:none;opacity:.6}
.ground .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative;z-index:1;padding-top:8px}
.block{font-family:var(--pixel);font-size:11px;padding:18px 6px;border:4px solid var(--edge);box-shadow:inset -5px -5px 0 rgba(0,0,0,.18),inset 5px 5px 0 rgba(255,255,255,.35),4px 4px 0 var(--edge);text-transform:uppercase;position:relative}
.block.buy{background:var(--red);color:#fff} .block.get{background:var(--coin);color:var(--ink)}
.block.bump{animation:bump .25s steps(3)}
@keyframes bump{50%{transform:translateY(-10px)}}
/* folha */
#scrim{position:fixed;inset:0;background:rgba(27,27,58,.55);z-index:40}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:94vh;overflow-y:auto;background:var(--paper);border-top:4px solid var(--edge);
  padding:16px max(14px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));overscroll-behavior:contain}
#sheet .in{max-width:540px;margin:0 auto;display:grid;gap:14px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shead b{font-family:var(--pixel);font-size:12px;line-height:1.4}
.x{font-family:var(--pixel);font-size:11px;padding:10px 12px;border:3px solid var(--edge);background:#fff}
.amount{font-size:60px;text-align:center}
.lbl{font-family:var(--pixel);font-size:8.5px;color:var(--dim);margin-bottom:8px;display:block;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:21px;padding:6px 10px;background:#fff;border:3px solid var(--edge);box-shadow:3px 3px 0 rgba(27,27,58,.85);white-space:nowrap}
.chip.on{background:var(--coin)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.save{font-family:var(--pixel);font-size:13px;padding:18px;width:100%;border:4px solid var(--edge);box-shadow:4px 4px 0 rgba(27,27,58,.85);background:var(--green);color:#fff}
.del{font-family:var(--pixel);font-size:10px;padding:14px;width:100%;border:3px solid var(--red);color:var(--red);background:transparent}
/* efeitos */
#toast{position:fixed;left:50%;top:calc(130px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:95;font-family:var(--pixel);font-size:10px;padding:12px 14px;background:#fff;border:4px solid var(--edge);box-shadow:4px 4px 0 rgba(27,27,58,.85);max-width:min(92vw,460px);text-align:center;line-height:1.6}
.pop{position:fixed;z-index:96;font-family:var(--pixel);font-size:14px;color:var(--coin);text-shadow:2px 2px 0 var(--edge);pointer-events:none;animation:pop 1s steps(8) forwards}
@keyframes pop{to{transform:translateY(-70px);opacity:0}}
.coinfly{position:fixed;z-index:96;width:18px;height:22px;background:var(--coin);border:3px solid var(--edge);border-radius:40%;pointer-events:none;animation:coin .7s steps(7) forwards}
@keyframes coin{0%{transform:translateY(0) scaleX(1)}40%{transform:translateY(-80px) scaleX(.3)}70%{transform:translateY(-110px) scaleX(1)}100%{transform:translateY(-60px);opacity:0}}
#levelup{position:fixed;inset:0;z-index:97;display:grid;place-items:center;background:rgba(27,27,58,.7);text-align:center;padding:20px}
#levelup .card{background:var(--paper);border:4px solid var(--edge);padding:24px;box-shadow:6px 6px 0 var(--edge)}
#levelup .px{font-size:20px;color:var(--red);line-height:1.5}
.sync{font-family:var(--pixel);font-size:8px;color:var(--ink);background:rgba(255,255,255,.75);padding:4px 6px;display:inline-flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;background:var(--dim);display:inline-block}
.dot.ok{background:var(--green)} .dot.busy{background:var(--coin)} .dot.err{background:var(--red)}
.setup{margin-top:40px;display:grid;gap:14px}

@media (max-width:370px){.score b{font-size:21px}.block{font-size:9px}.hiscore b{font-size:44px}.tabs button{font-size:7px}}
</style>

<body>
<div class="clouds" aria-hidden="true"><i class="cloud" style="top:12%;animation-duration:70s"></i><i class="cloud" style="top:34%;animation-duration:95s;animation-delay:-40s"></i><i class="cloud" style="top:58%;animation-duration:80s;animation-delay:-20s"></i></div>
<div class="wrap">
  <header id="hdr" hidden>
    <button class="hud" data-act="trophies" aria-label="Nível e conquistas">
      <span class="lvl" id="h_lvl">LV 1</span>
      <span class="xp"><span class="t" id="h_title">NOVATO</span><span class="xpbar"><i id="h_xp" style="width:0%"></i></span></span>
      <span class="stat" id="h_streak">🔥0</span>
      <span class="stat" id="h_coins">🪙0</span>
    </button>
    <nav class="tabs" aria-label="Separadores">
      <button data-tab="jogo" class="on">JOGO</button><button data-tab="lista">LISTA</button><button data-tab="saldo">SALDO</button><button data-tab="grafico">GRÁFICO</button>
    </nav>
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="sync" id="sync"><span class="dot"></span><span>—</span></span><button class="btn small alt" data-act="refresh">⟳ ATUALIZAR</button></div>
  </header>
  <main id="main"></main>
</div>
<div class="ground" id="ground" hidden><div class="in">
  <button class="block buy" data-act="add" data-type="out">− Compra</button>
  <button class="block get" data-act="add" data-type="in">+ Recebi</button>
</div></div>
<div id="scrim" hidden></div>
<div id="sheet" hidden role="dialog" aria-modal="true"><div class="in" id="sheetin"></div></div>
<div id="toast" hidden></div>
<div id="levelup" hidden></div>

<script>
"use strict";
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EUR=new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR"});
const EUR0=new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const fmt=c=>EUR.format((c||0)/100), fmt0=c=>EUR0.format(Math.round((c||0)/100));
const pad=n=>String(n).padStart(2,"0");
const isoD=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>isoD(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return isoD(d)};
const diffDays=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const nowTime=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const ymOf=s=>String(s||"").slice(0,7);
const addMonths=(ym,n)=>{let[y,m]=ym.split("-").map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return`${y}-${pad(m)}`};
const daysIn=ym=>{const[y,m]=ym.split("-").map(Number);return new Date(y,m,0).getDate()};
const MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MES3=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const SEM=["dom","seg","ter","qua","qui","sex","sáb"];
const monthLabel=ym=>{const[y,m]=ym.split("-").map(Number);return MES[m-1]+" "+y};
const dayLabel=s=>s===today()?"Hoje":s===addDays(today(),-1)?"Ontem":(d=>`${SEM[d.getDay()]} ${d.getDate()} ${MES3[d.getMonth()]}`)(new Date(s+"T12:00:00"));
const weekStart=s=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()-(d.getDay()+6)%7);return isoD(d)};
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const genId=p=>(p||"t")+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function parseAmt(v){if(typeof v==="number")return Math.round(Math.abs(v)*100);let s=String(v||"").replace(/[^\d,.]/g,"");if(!s)return 0;const dec=Math.max(s.lastIndexOf(","),s.lastIndexOf("."));let n;
  if(dec>=0&&s.length-dec-1<=2&&s.length-dec-1>0)n=parseFloat(s.slice(0,dec).replace(/[.,]/g,"")+"."+s.slice(dec+1));else n=parseFloat(s.replace(/[.,]/g,""));return isFinite(n)?Math.round(n*100):0}
const toInput=c=>c?(c/100).toFixed(2).replace(".",","):"";
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ============ estado e dados ============ */
const METHODS=["Apple Pay","MB WAY","Cartão","Transferência","Dinheiro","Online"];
const BET=/betano|gobet|placard|betclic|bwin|solverde|esc ?online|casino|lebull|nossa ?aposta|betway|22bet|pokerstars|luckia|bacana|moosh/;
const S={api:LS.get("api",""),tx:new Map(),accounts:new Map(),cats:new Map(),recur:new Map(),game:{},config:{},
  ready:false,tab:"jogo",month:ymOf(today()),form:null,visited:{},q:"",fAcc:"",fCat:"",fTrip:"",queue:LS.get("fila",[]),sync:"—"};
const fromRow=r=>({id:r.id,type:r.tipo,amt:Math.round(Math.abs(Number(String(r.valor).replace(",","."))||0)*100),date:r.data,time:r.hora||"",place:r.loja||"",cat:r.categoria||"",acc:r.conta||"",to:r.para||"",method:r.metodo||"",src:r.origem||"manual",review:r.rever==="1",created:Number(r.criado)||0,card:r.cartao||"",loc:r.morada||"",notes:r.notas||""});
const toRow=t=>({id:t.id,data:t.date,hora:t.time||"",tipo:t.type,valor:+(t.amt/100).toFixed(2)*(t.type==="adjust"&&t.neg?-1:1),loja:t.place||"",categoria:t.cat||"",conta:t.acc||"",para:t.to||"",metodo:t.method||"",origem:t.src||"manual",rever:t.review?"1":"",criado:String(t.created||Date.now()),cartao:t.card||"",morada:t.loc||"",notas:t.notes||""});
function load(d){
  S.tx.clear();for(const r of d.tx||[]){const t=fromRow(r);if(r.tipo==="adjust")t.amt=Math.round((Number(String(r.valor).replace(",","."))||0)*100);S.tx.set(t.id,t)}
  S.accounts.clear();for(const r of d.contas||[])S.accounts.set(r.id,{id:r.id,name:r.nome,kind:r.tipo,opening:Math.round(Number(r.saldo_inicial)*100)||0,openDate:r.data_inicial,openAt:Number(r.criado_em)||0,color:r.cor,order:Number(r.ordem)||0,hidden:r.oculta==="1"});
  S.cats.clear();for(const r of d.cats||[])S.cats.set(r.id,{id:r.id,name:r.nome,emoji:r.emoji,color:r.cor,kind:r.tipo,budget:Math.round(Number(r.limite)*100)||0,order:Number(r.ordem)||0});
  S.recur.clear();for(const r of d.recur||[])S.recur.set(r.id,{...r});
  S.game=d.jogo||{};S.config=d.config||{};S.prices=d.precos||S.prices||{};
  for(const q of S.queue)applyLocal(q);
}
function applyLocal(q){if(q.a==="put"){const t=fromRow(q.row);if(q.row.tipo==="adjust")t.amt=Math.round(q.row.valor*100);S.tx.set(t.id,t)}else if(q.a==="del")S.tx.delete(q.id);else if(q.a==="jogo")S.game=q.jogo;else if(q.a==="config")S.config=q.config;else if(q.a==="recur")S.recur.set(q.row.id,q.row);else if(q.a==="recurdel")S.recur.delete(q.id);else if(q.a==="cat"){const r=q.row;S.cats.set(r.id,{id:r.id,name:r.nome,emoji:r.emoji,color:r.cor,kind:r.tipo,budget:Math.round(Number(r.limite)*100)||0,order:Number(r.ordem)||0})}}
function setSync(s,m){S.sync=m;const el=$("#sync");if(!el)return;el.querySelector(".dot").className="dot "+s;el.querySelector("span:last-child").textContent=m}
async function api(body){const r=await fetch(S.api,{method:"POST",body:JSON.stringify(body)});const j=await r.json().catch(()=>({ok:true}));if(j&&j.ok===false)throw new Error(j.erro||"erro");return j}
async function send(op){ // grava já no ecrã, envia para a folha e repete se falhar
  applyLocal(op);S.queue=S.queue.filter(q=>!(q.a===op.a&&((q.row&&op.row&&q.row.id===op.row.id)||(q.id&&q.id===op.id)||(op.a==="jogo"||op.a==="config"))));S.queue.push(op);LS.set("fila",S.queue);cacheSave();draw();flush();
}
let flushing=false;async function flush(){if(flushing||!S.queue.length)return;flushing=true;setSync("busy","A GRAVAR…");
  while(S.queue.length){const op=S.queue[0];try{await api(op);S.queue.shift();LS.set("fila",S.queue)}catch(e){setSync("err",`SEM REDE · ${S.queue.length} POR ENVIAR`);flushing=false;setTimeout(flush,8000);return}}
  flushing=false;setSync("ok","GUARDADO "+nowTime())}
function cacheSave(){LS.set("cache",{tx:[...S.tx.values()].map(toRow),contas:[...S.accounts.values()].map(a=>({id:a.id,nome:a.name,tipo:a.kind,saldo_inicial:(a.opening/100).toFixed(2),data_inicial:a.openDate,criado_em:String(a.openAt),cor:a.color,ordem:String(a.order),oculta:a.hidden?"1":""})),cats:[...S.cats.values()].map(c=>({id:c.id,nome:c.name,emoji:c.emoji,cor:c.color,tipo:c.kind,limite:c.budget/100,ordem:c.order})),recur:[...S.recur.values()],jogo:S.game,config:S.config,precos:S.prices})}
async function refresh(manual){
  if(!S.api)return;setSync("busy","A ATUALIZAR…");
  try{const r=await fetch(S.api+"?a=all&t="+Date.now());const d=await r.json();if(!d.ok)throw 0;load(d);cacheSave();S.ready=true;setSync("ok","ATUALIZADO "+nowTime());render();dailyCheck();flush();if(manual)toast("TUDO EM DIA")}
  catch(e){setSync("err","SEM LIGAÇÃO");if(manual)toast("NÃO CONSEGUI LIGAR. VÊ A INTERNET.")}
}

/* ============ saldos e categorias ============ */
const accs=()=>[...S.accounts.values()].filter(a=>!a.hidden).sort((a,b)=>a.order-b.order);
const cats=k=>[...S.cats.values()].filter(c=>!k||c.kind===k).sort((a,b)=>a.order-b.order);
const cat=id=>S.cats.get(id)||{name:"Outros",emoji:"•",color:"#999"};
const accName=id=>S.accounts.get(id)?.name||"—";
const txs=()=>[...S.tx.values()];
const flows=()=>txs().filter(t=>t.type==="out"||t.type==="in");
const skey=t=>t.date+(t.time||"00:00")+String(t.created||0).padStart(15,"0");
const pending=()=>txs().filter(t=>t.review).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
function affects(t,a){return t.date>a.openDate||(t.date===a.openDate&&(t.created||0)>(a.openAt||0))}
function balance(id){const iv=invVal(id);return iv?iv.v:ledger(id)}
function ledger(id){const a=S.accounts.get(id);if(!a)return 0;let b=a.opening;for(const t of S.tx.values()){if(!affects(t,a))continue;
  if(t.type==="out"&&t.acc===id)b-=t.amt;else if(t.type==="in"&&t.acc===id)b+=t.amt;else if(t.type==="transfer"){if(t.acc===id)b-=t.amt;if(t.to===id)b+=t.amt}else if(t.type==="adjust"&&t.acc===id)b+=t.amt}return b}
const RULES=[[/continente|pingo doce|lidl|mercadona|minipreco|intermarche|aldi|spar|froiz/,"supermercado"],[/mcdonald|burger|kfc|pizza|starbucks|cafe|pastelaria|padaria|restaurante|tasca|sushi|glovo|uber eats|five guys/,"restaurantes"],
  [/galp|repsol|prio|cepsa|auchan energy|via verde|uber|bolt|metro|stcp|andante|comboios|parque|portagem/,"transportes"],[/farmacia|wells|clinica|hospital|dentista|optica/,"saude"],[/netflix|spotify|youtube|apple|icloud|patreon|hbo|prime video|anthropic/,"subscricoes"],
  [/padel|ginasio|decathlon|whoop/,"desporto"],[/cinema|uci|ticketline|steam|playstation|fc porto/,"lazer"],[/fnac|worten|zara|primark|amazon|ikea|shein|temu|bershka/,"compras"],[/booking|airbnb|hotel|ryanair|easyjet/,"viagens"],[/edp|meo|altice|vodafone|nos /,"casa"]];
function guessCat(place,type){const n=norm(place);const def=type==="in"?"outras-entradas":"outros";if(!n)return def;
  if(type==="out"&&BET.test(n))return"apostas";
  const hit=flows().filter(t=>t.type===type&&!t.review&&norm(t.place)===n).sort((a,b)=>b.created-a.created)[0];if(hit)return hit.cat;
  if(type==="out")for(const[re,c]of RULES)if(re.test(" "+n+" ")&&S.cats.has(c))return c;return def}
const isBet=t=>t.type==="out"&&(t.cat==="apostas"||BET.test(norm(t.place)));

/* ============ desafio sem apostas ============ */
const BET_DAILY=()=>(S.config.betDaily||46)*100;
function betInfo(){
  const bets=txs().filter(isBet).sort((a,b)=>b.date.localeCompare(a.date));const last=bets[0]?.date||null;const td=today();
  const cleanDays=last?(last===td?0:diffDays(last,td)):0;
  const stages=[{d:30,n:"REI BETANO"},{d:60,n:"REI BETANO II"},{d:90,n:"IMPERADOR DO CASINO"}];
  const st=stages.find(s=>cleanDays<s.d)||stages[stages.length-1];const prev=stages[stages.indexOf(st)-1]?.d||0;
  const hp=Math.max(0,1-(cleanDays-prev)/(st.d-prev));
  const m=ymOf(td);const monthBet=bets.filter(t=>ymOf(t.date)===m).reduce((s,t)=>s+t.amt,0);
  return{last,clean:cleanDays,best:Math.max(S.game.bestClean||0,cleanDays),boss:st,hp,toWin:Math.max(0,st.d-cleanDays),saved:cleanDays*BET_DAILY(),monthBet,count30:bets.filter(t=>t.date>=addDays(td,-30)).length};
}
const GOALS=[{n:"Jantar fora a dois",v:6000},{n:"Bilhetes de ténis",v:30000},{n:"Fim de semana fora",v:60000},{n:"Um mês de liberdade",v:138000},{n:"Entrada da casa",v:4000000}];

/* ============ jogo ============ */
const TITLES=["Novato da Moeda","Aprendiz do Cofre","Contador de Cêntimos","Poupador","Estratega","Guardião do Cofre","Mestre do Orçamento","Lenda do Euro","Magnata","Rei da Carteira"];
const lvlOf=xp=>{let n=1;while(xp>=50*(n+1)*n)n++;return n};const lvlFloor=n=>50*n*(n-1);
const BADGES=[{id:"first",e:"🪙",n:"1.ª MOEDA",d:"Primeiro registo"},{id:"s7",e:"🔥",n:"SEMANA FIEL",d:"Registar 7 dias seguidos"},{id:"s30",e:"👑",n:"MÊS DE FERRO",d:"Registar 30 dias seguidos"},
  {id:"c3",e:"🛡️",n:"ESCUDO",d:"3 dias sem apostas"},{id:"c7",e:"⚔️",n:"GUERREIRO",d:"7 dias sem apostas"},{id:"c14",e:"🏹",n:"ARQUEIRO",d:"14 dias sem apostas"},
  {id:"c30",e:"🏆",n:"REI DERROTADO",d:"30 dias sem apostas"},{id:"c60",e:"💎",n:"IMPARÁVEL",d:"60 dias sem apostas"},{id:"c90",e:"🌟",n:"LIVRE",d:"90 dias sem apostas"},
  {id:"z1",e:"🧊",n:"DIA ZERO",d:"Um dia sem gastos"},{id:"b1",e:"👾",n:"MATA-MONSTRO",d:"Vencer o monstro da semana"},{id:"c20",e:"🧲",n:"ÍMAN",d:"Apanhar 20 moedas AUTO"},
  {id:"r50",e:"📜",n:"ESCRIVÃO",d:"50 registos"},{id:"l5",e:"⭐",n:"NÍVEL 5",d:"Chegar ao nível 5"},{id:"l10",e:"🌈",n:"NÍVEL 10",d:"Chegar ao nível 10"},{id:"sos3",e:"🧘",n:"RESISTI",d:"Vencer 3 vontades com o SOS"},{id:"pay3",e:"💸",n:"PAGA-TE PRIMEIRO",d:"Investir no dia de pagamento 3 vezes"}];
function game(){return{xp:0,coins:0,freezes:1,days:{},quests:{},badges:{},reg:0,zero:0,caught:0,monsterWins:0,questsDone:0,weeks:{},weekLimit:0,cleanPaid:0,bestClean:0,...S.game}}
function saveGame(g){send({a:"jogo",jogo:g})}
function streakOf(g){let d=g.days[today()]?today():addDays(today(),-1),n=0;while(g.days[d]){n++;d=addDays(d,-1)}return n}
function award(g,xp,coins,ev,label){const b=lvlOf(g.xp);g.xp+=xp;g.coins+=coins||0;pop(ev,label||`+${xp} XP`);if(lvlOf(g.xp)>b){levelUp(lvlOf(g.xp));g.coins+=5}checkBadges(g)}
function checkBadges(g){const st=streakOf(g),c=betInfo().clean,L=lvlOf(g.xp);
  const ok={first:g.reg>=1,s7:st>=7,s30:st>=30,c3:c>=3,c7:c>=7,c14:c>=14,c30:c>=30,c60:c>=60,c90:c>=90,z1:g.zero>=1,b1:g.monsterWins>=1,c20:g.caught>=20,r50:g.reg>=50,l5:L>=5,l10:L>=10,sos3:(g.sosWins||0)>=3,pay3:(g.payDone||0)>=3};
  for(const b of BADGES)if(ok[b.id]&&!g.badges[b.id]){g.badges[b.id]=today();g.coins+=10;setTimeout(()=>{toast(`CONQUISTA! ${b.e} ${b.n} · +10 🪙`);fanfare()},700)}}
function act(kind,ev){const g=game(),t=today(),first=!g.days[t];if(first)g.days[t]=1;
  const R={reg:[10,1],catch:[5,1],zero:[25,3]}[kind]||[5,0];if(kind==="reg")g.reg++;if(kind==="catch")g.caught++;if(kind==="zero")g.zero++;
  award(g,R[0]+(first?5:0),R[1],ev,`+${R[0]+(first?5:0)} XP`);if(first&&streakOf(g)>1)setTimeout(()=>toast(`🔥 ${streakOf(g)} DIAS SEGUIDOS!`),400);
  evalQuests(g);saveGame(g)}
const QUESTS={log:{t:"Regista o dia (movimento ou dia sem gastos)",xp:15,ok:g=>!!g.days[today()]},
  nobet:{t:"Não apostar hoje (conta a partir das 21h)",xp:30,ok:()=>new Date().getHours()>=21&&!txs().some(t=>isBet(t)&&t.date===today())},
  catch:{t:"Apanha todas as moedas AUTO",xp:15,ok:()=>pending().length===0&&txs().some(t=>t.date===today()&&t.src!=="manual"&&t.src!=="extrato")},
  graph:{t:"Espreita o gráfico do mês",xp:10,ok:()=>!!S.visited.grafico},saldo:{t:"Confere os saldos",xp:10,ok:()=>!!S.visited.saldo},
  place:{t:"Regista uma compra com o sítio",xp:15,ok:()=>txs().some(t=>t.type==="out"&&t.date===today()&&t.place&&t.src==="manual")}};
function todayQuests(){const pool=["catch","graph","saldo","place"];return["log","nobet",pool[hash(today())%pool.length]]}
function evalQuests(g){const t=today(),done=new Set(g.quests[t]||[]);let ch=false;
  for(const q of todayQuests())if(!done.has(q)&&QUESTS[q].ok(g)){done.add(q);ch=true;g.questsDone++;const Q=QUESTS[q];setTimeout(()=>{toast(`MISSÃO! +${Q.xp} XP`);chime()},250);award(g,Q.xp+(done.size===3?20:0),done.size===3?3:1,null)}
  if(ch)g.quests={[t]:[...done]};return ch}
function weekLimit(){const g=game();if(g.weekLimit)return g.weekLimit;const outs=flows().filter(t=>t.type==="out"&&!isBet(t)&&t.cat!=="pessoas");const ws=weekStart(today());let tot=0,w=0;
  for(let i=1;i<=4;i++){const a=addDays(ws,-7*i),b=addDays(a,6);const s=outs.filter(t=>t.date>=a&&t.date<=b).reduce((x,t)=>x+t.amt,0);if(s){tot+=s;w++}}return w?Math.round(tot/w*.9/500)*500:10000}
function monster(ws){ws=ws||weekStart(today());const we=addDays(ws,6),lim=weekLimit();const spent=flows().filter(t=>t.type==="out"&&!isBet(t)&&t.cat!=="pessoas"&&t.date>=ws&&t.date<=we).reduce((s,t)=>s+t.amt,0);
  return{ws,we,lim,spent,hp:Math.max(0,lim-spent),pct:lim?Math.max(0,(lim-spent)/lim):0}}
function dailyCheck(){const g=game();let ch=false;const td=today(),y=addDays(td,-1);
  if(!g.days[y]&&!g.days[td]){let gap=[],d=y;for(let i=0;i<7&&!g.days[d];i++){gap.push(d);d=addDays(d,-1)}if(g.days[d]&&gap.length<=g.freezes){gap.forEach(x=>g.days[x]="f");g.freezes-=gap.length;ch=true;setTimeout(()=>toast("🧊 GELO USADO · SEQUÊNCIA SALVA"),600)}}
  const bi=betInfo(),full=Math.max(0,bi.clean-1); // só dias completos (até ontem) contam para XP

function vGraf(){const l=monthTx(S.month);const by=new Map();let out=0;for(const t of l)if(t.type==="out"){by.set(t.cat,(by.get(t.cat)||0)+t.amt);out+=t.amt}

/* ============ investimentos (valor de mercado) ============ */
const invOf=id=>(S.config.invest||[]).find(x=>x.acc===id);
function pxAt(y,date){const h=(S.prices||{})[y];if(!h)return null;if(!date||date>=today())return h.p||null;const ks=Object.keys(h.d||{}).sort();let v=null;for(const k of ks){if(k<=date)v=h.d[k];else break}return v??(ks.length?h.d[ks[0]]:h.p)}
function idx(inv,date){let I=inv.cash||0;for(const l of inv.legs||[]){const p=pxAt(l.y,date);if(p==null)return null;I+=l.w*(l.b?p/l.b:p)}return I}
function invVal(id){const inv=invOf(id);if(!inv||inv.U==null)return null;const In=idx(inv);if(!In)return null;let U=inv.U,cost=Math.round(inv.refCost*100);
  for(const t of S.tx.values()){if(t.type!=="transfer"||(t.created||0)<=inv.refAt)continue;const s=t.to===id?1:t.acc===id?-1:0;if(!s)continue;const I=idx(inv,t.date)||In;
    if(s<0){const val=U*In*100;cost-=val>0?Math.round(cost*Math.min(1,t.amt/val)):t.amt}else cost+=t.amt;U+=s*(t.amt/100)/I}
  const v=Math.round(U*In*100);return{v,cost,gain:v-cost,pct:cost?(v-cost)/cost:0,U,In}}
function invSheet(id){const a=S.accounts.get(id),inv=invOf(id),iv=invVal(id);
  openSheet(`<div class="shead"><b>📈 ${esc(a.name)}</b><button class="x" data-act="close">X</button></div>
  <div class="score"><div><span>VALE HOJE</span><b>${fmt(iv.v)}</b></div><div><span>INVESTIDO</span><b>${fmt(iv.cost)}</b></div><div><span>GANHO</span><b class="${iv.gain>=0?"up":"down"}">${iv.gain>=0?"+":"−"}${fmt(Math.abs(iv.gain))}</b></div></div>
  <div class="board"><div class="kv">${inv.legs.map(l=>{const p=S.prices[l.y]||{};return`<span>${esc(l.n||l.y)}${l.b?` <span class="dim">(${Math.round(l.w*100)}% da referência)</span>`:""}</span><b>${p.p?fmt(Math.round(p.p*100)):"—"}</b>`}).join("")}
  ${inv.legs.length===1&&!inv.legs[0].b?`<span>Unidades</span><b>${iv.U.toFixed(4).replace(".",",")}</b>`:""}</div>

  <div class="two"><div><span class="lbl">Valor hoje</span><input id="iv_v" inputmode="decimal" placeholder="${esc(toInput(iv.v))}"></div><div><span class="lbl">Ganho total (opcional)</span><input id="iv_g" inputmode="decimal" placeholder="ex.: +15,94 ou -1,05"></div></div>

/* ============ favoritos ============ */
function favs(){const from=addDays(today(),-90),m=new Map();
  for(const t of flows())if(t.type==="out"&&!t.review&&t.date>=from&&t.place&&!isBet(t)&&t.cat!=="pessoas"&&t.src!=="recorrente"&&t.cat!=="subscricoes"&&t.cat!=="viagens"){const k=norm(t.place)+"|"+t.amt;const e=m.get(k)||{n:0,t};e.n++;if((t.created||0)>=(e.t.created||0))e.t=t;m.set(k,e)}
  return[...m.values()].filter(e=>e.n>=2).sort((a,b)=>b.n-a.n||(b.t.created||0)-(a.t.created||0)).slice(0,8).map(e=>e.t)}

const recMonthly=r=>Math.round(Number(r.valor)*100)||0;
function nextOcc(dia){const ym=ymOf(today());let d=`${ym}-${pad(Math.min(dia,daysIn(ym)))}`;if(d<today()){const n=addMonths(ym,1);d=`${n}-${pad(Math.min(dia,daysIn(n)))}`}return d}
function fixedBoard(){const out=recs().filter(r=>r.ativo==="1"&&r.tipo==="out").sort((a,b)=>recMonthly(b)-recMonthly(a)),tot=out.reduce((s,r)=>s+recMonthly(r),0);

  return`<div class="board"><div class="kv">${out.map(r=>`<span>${esc(r.nome)} <span class="dim">· dia ${esc(r.dia)}</span></span><b>${fmt(recMonthly(r))}</b>`).join("")}<span class="tot">Por mês</span><b class="tot down">${fmt(tot)}</b><span>Por ano</span><b class="down">${fmt(tot*12)}</b></div></div>`}
function recursSheet(){const all=recs(),sec=(k,t)=>{const l=all.filter(r=>r.tipo===k).sort((a,b)=>(b.ativo==="1")-(a.ativo==="1")||Number(a.dia)-Number(b.dia));if(!l.length)return"";
    return`<span class="lbl" style="margin:6px 0 -6px">${t}</span>`+l.map(r=>`<button class="row${r.ativo==="1"?"":" off"}" style="grid-template-columns:40px 1fr auto" data-act="recedit" data-id="${esc(r.id)}"><span class="ic">${k==="in"?"💰":k==="transfer"?"⇄":esc(cat(r.categoria).emoji||"🔁")}</span><span style="min-width:0"><span class="t1">${esc(r.nome)}</span><span class="t2">${r.ativo==="1"?"":"DESATIVADA · "}${r.flex==="1"?"dia varia":"dia "+esc(r.dia)}${r.variavel==="1"?" · valor varia":""} · ${esc(accName(r.conta))}${k==="transfer"?" → "+esc(accName(r.para)):""}</span></span><span class="amt ${k==="out"?"down":k==="in"?"up":""}">${fmt(recMonthly(r))}</span></button>`).join("")};
  const subs=all.filter(r=>r.ativo==="1"&&r.tipo==="out").reduce((s,r)=>s+recMonthly(r),0);
  openSheet(`<div class="shead"><b>🔁 FIXOS E SUBSCRIÇÕES</b><button class="x" data-act="close">X</button></div>
  <div class="score"><div><span>SAÍDAS/MÊS</span><b class="down">${fmt(subs)}</b></div><div><span>POR ANO</span><b class="down">${fmt0(subs*12)}</b></div><div><span>ATIVOS</span><b>${all.filter(r=>r.ativo==="1").length}</b></div></div>

/* ============ folhas ============ */
function openSheet(h){$("#sheetin").innerHTML=h;$("#sheet").hidden=false;$("#scrim").hidden=false;document.body.style.overflow="hidden"}
function closeSheet(){$("#sheet").hidden=true;$("#scrim").hidden=true;document.body.style.overflow="";S.form=null;S.tf=null;S.rf=null;S.trip=null;S.wr=null;clearInterval(S.sosT)}
const lastOf=type=>flows().filter(t=>t.type===type&&t.src==="manual").sort((a,b)=>b.created-a.created)[0];
function openAdd(type){const l=lastOf(type);S.form={id:null,type,amt:0,place:"",cat:"",method:l?.method||(type==="in"?"Transferência":"Apple Pay"),acc:l?.acc||accs()[0]?.id||"",date:today(),time:nowTime(),notes:""};form()}
function form(){const f=S.form,places=[...new Set(flows().filter(t=>t.type===f.type).map(t=>t.place).filter(Boolean))].slice(0,300);
  const chip=(k,v,l)=>`<button class="chip${f[k]===v?" on":""}" data-act="pick" data-k="${k}" data-v="${esc(v)}">${l}</button>`;
  openSheet(`<div class="shead"><b class="${f.type==="out"?"down":"up"}">${f.review?"APANHAR MOEDA":f.recur?"CONFIRMAR":f.id?"EDITAR":f.type==="out"?"− COMPRA":"+ RECEBI"}</b><button class="x" data-act="close">X</button></div>
  <input class="amount" id="f_amt" inputmode="decimal" placeholder="0,00 €" value="${esc(toInput(f.amt))}" autocomplete="off" aria-label="Valor">
  <div><span class="lbl">${f.type==="out"?"Onde foi":"De onde veio"}</span><input id="f_place" list="dl" value="${esc(f.place)}" placeholder="${f.type==="out"?"Continente, café, Galp…":"Petrolapa, avó, Inventors…"}" autocomplete="off"><datalist id="dl">${places.map(p=>`<option value="${esc(p)}">`).join("")}</datalist></div>
  <div><span class="lbl">Categoria</span><div class="chips">${cats(f.type==="out"?"out":"in").map(c=>chip("cat",c.id,`${esc(c.emoji)} ${esc(c.name)}`)).join("")}</div></div>
  <div><span class="lbl">Método</span><div class="chips">${METHODS.map(m=>chip("method",m,esc(m))).join("")}</div></div>
  <div><span class="lbl">Conta</span><div class="chips">${accs().map(a=>chip("acc",a.id,esc(a.name))).join("")}</div></div>
  <div class="two"><div><span class="lbl">Dia</span><input type="date" id="f_date" value="${esc(f.date)}"></div><div><span class="lbl">Hora</span><input type="time" id="f_time" value="${esc(f.time||"")}"></div></div>
  <div><span class="lbl">Notas (opcional)</span><textarea id="f_note" rows="2" placeholder="${f.type==="out"?"Ex.: Patreon do Cubinho · jantar de anos da Núria":"Ex.: aulas de outubro · prenda dos avós"}">${esc(f.notes||"")}</textarea></div>
  <button class="save" data-act="save">${f.review?"APANHAR · +5 XP":f.id&&!f.recur?"GUARDAR":"GUARDAR · +10 XP"}</button>
  ${f.id&&!f.recur?`<button class="del" data-act="del">${f.arm?"TOCA OUTRA VEZ PARA APAGAR":"APAGAR"}</button>`:""}`);
  if(!f.id&&!f.amt)setTimeout(()=>$("#f_amt")?.focus(),80)}
function readForm(){const f=S.form;f.amt=parseAmt($("#f_amt").value);f.place=$("#f_place").value.trim();f.date=$("#f_date").value||today();f.time=$("#f_time").value||"";f.notes=($("#f_note")?.value||"").trim()}
function learnCard(t,acc){if(!t.card)return;const k=norm(t.card),m={...(S.config.cardMap||{})};if(m[k]===acc)return;m[k]=acc;send({a:"config",config:{...S.config,cardMap:m}})}
async function save(ev){readForm();const f=S.form;if(!f.amt){toast("FALTA O VALOR");return}
  if(!f.cat)f.cat=guessCat(f.place,f.type);const prev=S.tx.get(f.id)||{};const isNew=!f.id||f.recur;const wasReview=!!prev.review;
  const t={...prev,id:f.id||genId(),type:f.type,amt:f.amt,place:f.place,cat:f.cat,method:f.method,acc:f.acc,date:f.date,time:f.time,notes:f.notes||"",review:false,src:prev.src||(f.recur?"recorrente":"manual"),created:prev.created||Date.now()};
  if(prev.src==="applepay")learnCard(prev,f.acc);
  const recId=f.recur;closeSheet();send({a:"put",row:toRow(t)});
  if(recId){const r=S.recur.get(recId);if(r)send({a:"recur",row:{...r,proximo:nextMonth(r.proximo,Number(r.dia))}})}
  if((isNew||wasReview)&&!f.recur)limitAlert(t);
  if(isNew&&!wasReview){f.type==="in"?coinSnd():outSnd();bump(f.type);act("reg",ev)}else if(wasReview){coinSnd();act("catch",ev)}else toast("GUARDADO");
  if(isBet(t))setTimeout(()=>toast("🎰 APOSTA REGISTADA · O REI BETANO RECUPEROU A VIDA. AMANHÃ RECOMEÇAMOS."),900)}
const nextMonth=(s,day)=>{const ym=addMonths(ymOf(s),1);return`${ym}-${pad(Math.min(day||+s.slice(8,10),daysIn(ym)))}`};
function bump(type){const b=document.querySelector(type==="in"?".block.get":".block.buy");if(b){b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}}
function quick(ev){const el=$("#qtext"),txt=(el.value||"").trim();if(!txt){openAdd("out");return}el.value="";
  const m=txt.match(/\d+(?:[.,]\d{1,2})?/);const amt=m?parseAmt(m[0]):0;let rest=txt.replace(m?m[0]:"","").replace(/€|euros?/gi,"").trim();
  const accHit=accs().find(a=>norm(rest).split(" ").includes(norm(a.name).split(" ")[0]));if(accHit)rest=rest.replace(new RegExp(norm(accHit.name).split(" ")[0],"i"),"").trim();
  const methHit=METHODS.find(x=>norm(rest).includes(norm(x)));if(methHit)rest=rest.replace(new RegExp(methHit,"i"),"").trim();
  const isIn=/^\+|receb|ganhei|entrou|salario|ordenado|petrolapa|inventors|avo/.test(norm(txt));const type=isIn?"in":"out";
  rest=rest.replace(/^(no|na|em|de|do|da)\s+/i,"").replace(/\s+(no|na|em)\s+/i," ").trim();const place=rest?rest[0].toUpperCase()+rest.slice(1):"";
  if(!amt){S.form={id:null,type,amt:0,place,cat:"",method:"Apple Pay",acc:accs()[0]?.id,date:today(),time:nowTime(),notes:""};form();toast("FALTA O VALOR");return}
  const hist=flows().filter(t=>norm(t.place)===norm(place)&&t.type===type).sort((a,b)=>b.created-a.created)[0],last=lastOf(type);
  const t={id:genId(),type,amt,place,cat:guessCat(place,type),acc:accHit?.id||hist?.acc||last?.acc||accs()[0]?.id,method:methHit||hist?.method||last?.method||"Apple Pay",date:today(),time:nowTime(),src:"manual",review:false,created:Date.now()};
  send({a:"put",row:toRow(t)});limitAlert(t);type==="in"?coinSnd():outSnd();bump(type);act("reg",ev);setTimeout(()=>toast(`${type==="out"?"−":"+"}${fmt(amt)} ${place} · ${cat(t.cat).name.toUpperCase()}`),300);
  if(isBet(t))setTimeout(()=>toast("🎰 APOSTA REGISTADA · AMANHÃ RECOMEÇAMOS."),1800)}
function trophies(){const g=game(),bi=betInfo();openSheet(`<div class="shead"><b>CONQUISTAS ${BADGES.filter(b=>g.badges[b.id]).length}/${BADGES.length}</b><button class="x" data-act="close">X</button></div>
  <div class="score"><div><span>NÍVEL</span><b>${lvlOf(g.xp)}</b></div><div><span>SEM APOSTAS</span><b class="up">${bi.clean}d</b></div><div><span>REGISTOS</span><b>${g.reg}</b></div></div>
  <div class="badges">${BADGES.map(b=>`<div class="badge ${g.badges[b.id]?"got":"lock"}"><em>${b.e}</em><b>${b.n}</b><span>${b.d}</span></div>`).join("")}</div>

/* ============ eventos ============ */

  else if(a==="zero"){chime();act("zero",e);S._party=Date.now();setTimeout(()=>toast("🧊 DIA ZERO! +25 XP +3 🪙"),200)}

  else if(a==="acc"){const c=S.accounts.get(el.dataset.id);openSheet(`<div class="shead"><b>${esc(c.name)}</b><button class="x" data-act="close">X</button></div>
    <div class="board"><span class="lbl">Saldo na Carteira</span><div style="font-size:40px">${fmt(balance(c.id))}</div></div><div><span class="lbl">Saldo real no banco</span><input id="real" inputmode="decimal" placeholder="0,00 €"></div>
    <button class="save" data-act="fix" data-id="${esc(c.id)}">ACERTAR SALDO</button><div class="note">A diferença fica registada como acerto e não conta como compra nem recebimento.</div>`)}
  else if(a==="fix"){const id=el.dataset.id,v=$("#real").value.trim();if(!v){toast("ESCREVE O SALDO");return}const diff=parseAmt(v)*(/^\s*[-−]/.test(v)?-1:1)-balance(id);closeSheet();if(!diff){toast("JÁ ESTÁ CERTO");return}
    const row=toRow({id:genId("a"),type:"adjust",amt:Math.abs(diff),date:today(),time:nowTime(),place:"Acerto de saldo",acc:id,src:"manual",created:Date.now()});row.valor=+(diff/100).toFixed(2);send({a:"put",row});toast("SALDO ACERTADO")}
  else if(a==="connect"){const u=$("#apiurl").value.trim();if(!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec/.test(u)){toast("ESSE LINK NÃO ACABA EM /exec");return}S.api=u;LS.set("api",u);render();refresh(true)}
  else if(a==="disconnect"){if(!el.dataset.arm){el.dataset.arm=1;el.textContent="TOCA OUTRA VEZ PARA DESLIGAR";return}LS.set("api","");LS.set("cache",null);S.api="";S.ready=false;closeSheet();render()}
});
document.addEventListener("input",e=>{if(e.target.id==="lsearch"){const was=!!(S.q||"").trim();S.q=e.target.value;if(was!==!!S.q.trim())render();else{const r=$("#lres");if(r)r.innerHTML=listBody()}}});
document.addEventListener("change",e=>{if(e.target.id==="lacc"||e.target.id==="lcat"){S[e.target.id==="lacc"?"fAcc":"fCat"]=e.target.value;render();return}
  if(e.target.id==="f_place"&&S.form&&!S.form.id){const n=norm(e.target.value);const hit=flows().filter(t=>t.type===S.form.type&&norm(t.place)===n).sort((a,b)=>b.created-a.created)[0];
  if(hit){S.form.cat=hit.cat;S.form.acc=hit.acc||S.form.acc;S.form.method=hit.method||S.form.method}else if(!S.form.cat)S.form.cat=guessCat(e.target.value,S.form.type);
  document.querySelectorAll("#sheet .chip[data-k]").forEach(c=>c.classList.toggle("on",S.form[c.dataset.k]===c.dataset.v))}}); // atualiza sem redesenhar (não perde o toque em GUARDAR)
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet();if(e.key==="Enter"&&e.target.id==="lsearch"){e.preventDefault();e.target.blur();return}if(e.key==="Enter"&&e.target.id==="qtext"){e.preventDefault();quick(null)}else if(e.key==="Enter"&&S.tf&&e.target.tagName==="INPUT"&&!$("#sheet").hidden){e.preventDefault();document.querySelector('[data-act="tfsave"]')?.click()}else if(e.key==="Enter"&&S.form&&e.target.tagName==="INPUT"){e.preventDefault();save(null)}});
$("#scrim").addEventListener("click",closeSheet);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.api)refresh(false)});
window.addEventListener("online",flush);
setInterval(()=>{const cv=$("#pig");if(cv&&$("#sheet").hidden)drawPig(cv,mood())},4000);

/* arranque: mostra logo a cópia guardada, depois atualiza da folha */
const cache=LS.get("cache",null);if(S.api&&cache){load(cache);S.ready=true}
render();if(S.api)refresh(false);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
