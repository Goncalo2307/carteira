<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carteira</title>
<meta name="theme-color" content="#5DADEC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carteira">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Plataformas retro: céu, nuvens em píxeis, chão de relva em baixo. Painéis = placas de madeira clara com contorno escuro. Mascote original: o Mealheiro. */
:root{
  --sky1:#5DADEC; --sky2:#A9DCFF; --ink:#1B1B3A; --paper:#FFF8E7; --paper2:#FFEFC7; --edge:#1B1B3A;
  --coin:#FFC400; --coin2:#E09A00; --red:#E8453C; --green:#2EB85C; --grass:#46C35A; --dirt:#B5652B; --dirt2:#8E4A1C;
  --dim:#6B6390; --pink:#FF6FA8; --blue:#2F7DE1;
  --pixel:"Press Start 2P",ui-monospace,monospace; --crt:"VT323",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--sky1);color:var(--ink)}
body{font-family:var(--crt);font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums;min-height:100vh;
  padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) calc(150px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--sky1),var(--sky2) 70%) fixed}
.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;width:12px;height:12px;background:#fff;box-shadow:12px 0 #fff,24px 0 #fff,36px 0 #fff,12px -12px #fff,24px -12px #fff,-12px 0 #fff,48px 0 #fff,24px -24px #fff;opacity:.9;animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}
.wrap{max-width:540px;margin:0 auto;position:relative;z-index:1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;font-size:24px;color:var(--ink);background:#fff;border:3px solid var(--edge);border-radius:0;padding:8px 10px;width:100%;outline:none;min-width:0}
input:focus{border-color:var(--blue)}
:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.px{font-family:var(--pixel)}
.dim{color:var(--dim)} .up{color:var(--green)} .down{color:var(--red)}
.board{min-width:0;overflow:hidden;background:var(--paper);border:4px solid var(--edge);box-shadow:5px 5px 0 rgba(27,27,58,.85);padding:14px}
h2{font-family:var(--pixel);font-size:11px;color:#fff;text-shadow:2px 2px 0 var(--edge);margin:22px 0 10px;text-transform:uppercase;line-height:1.5;display:flex;justify-content:space-between;align-items:end;gap:8px}
h2 small{font-family:var(--crt);font-size:19px;text-shadow:none;color:var(--ink);background:rgba(255,255,255,.75);padding:0 6px;text-transform:none}
/* HUD */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:10px 0;display:grid;gap:10px;background:linear-gradient(var(--sky1) 80%,transparent)}
.hud{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;width:100%;text-align:left;background:var(--paper);border:4px solid var(--edge);padding:8px 10px;box-shadow:4px 4px 0 rgba(27,27,58,.85)}
.lvl{white-space:nowrap;font-family:var(--pixel);font-size:10px;background:var(--red);color:#fff;padding:6px;border:3px solid var(--edge)}
.xp .t{font-family:var(--pixel);font-size:7.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-bottom:5px}
.xpbar{display:block;height:12px;border:3px solid var(--edge);background:#fff;position:relative}
.xpbar i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--green) 0 6px,#23964a 6px 8px)}
.stat{font-family:var(--pixel);font-size:10px;white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabs button{font-family:var(--pixel);font-size:8.5px;padding:10px 2px;background:var(--paper);border:3px solid var(--edge);box-shadow:3px 3px 0 rgba(27,27,58,.85)}
.tabs button.on{background:var(--coin);}
.press:active,.tabs button:active,.chip:active,.block:active,.btn:active{transform:translate(3px,3px);box-shadow:none!important}
/* mascote */
.hero{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:center;margin-top:12px}
.hero canvas{width:88px;height:88px;image-rendering:pixelated;animation:hop 1.4s steps(2) infinite}
@keyframes hop{50%{transform:translateY(-6px)}}
.bubble{position:relative;background:#fff;padding:10px 12px;font-size:21px;border:4px solid var(--edge);box-shadow:4px 4px 0 rgba(27,27,58,.85)}
.bubble::before{content:"";position:absolute;left:-14px;top:24px;border:7px solid transparent;border-right-color:var(--edge)}
/* sem apostas */
.clean{display:grid;gap:12px;background:linear-gradient(var(--paper),var(--paper2))}
.clean .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.clean .big b{font-family:var(--pixel);font-size:30px;color:var(--green);text-shadow:3px 3px 0 var(--edge)}
.clean .big b.zero{color:var(--red)}
.saved{font-family:var(--pixel);font-size:11px;line-height:1.6}
.hp{height:22px;border:3px solid var(--edge);background:#fff;position:relative}
.hp i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--red) 0 8px,#b8302a 8px 10px)}
.hp.g i{background:repeating-linear-gradient(90deg,var(--green) 0 8px,#23964a 8px 10px)}
.hp.y i{background:repeating-linear-gradient(90deg,var(--coin) 0 8px,var(--coin2) 8px 10px)}
.hp span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--pixel);font-size:8px;color:#fff;text-shadow:2px 2px 0 var(--edge)}
.boss{display:flex;justify-content:space-between;gap:8px;align-items:center;font-family:var(--pixel);font-size:9px;line-height:1.5}
.goals{display:grid;gap:6px}
.goal{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:19px}
.goal .tr{grid-column:1/-1;height:8px;border:2px solid var(--edge);background:#fff}
.goal .tr i{display:block;height:100%;background:var(--coin)}
/* rápido */
.quick{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}
.btn{font-family:var(--pixel);font-size:10px;padding:0 14px;min-height:50px;background:var(--coin);border:4px solid var(--edge);box-shadow:4px 4px 0 rgba(27,27,58,.85)}
.btn.alt{background:var(--paper)} .btn.green{background:var(--green);color:#fff} .btn.small{min-height:36px;font-size:8px;padding:0 10px;border-width:3px;box-shadow:3px 3px 0 rgba(27,27,58,.85)}
.hint{font-size:18px;color:var(--ink);background:rgba(255,255,255,.6);padding:2px 6px;margin-top:6px;display:inline-block}
/* listas */
.row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:9px 10px;background:var(--paper);border:3px solid var(--edge);margin-bottom:6px}
.row.auto{background:#FFF3B8;border-color:var(--coin2)}
.row .ic{width:40px;height:40px;display:grid;place-items:center;font-size:20px;background:#fff;border:3px solid var(--edge)}
.row .t1{display:block;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{display:block;font-size:18px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-size:26px;white-space:nowrap;text-align:right}
.tag{font-family:var(--pixel);font-size:7px;padding:2px 4px;background:var(--coin);border:2px solid var(--edge);vertical-align:middle;margin-left:6px}
.day{display:flex;justify-content:space-between;font-family:var(--pixel);font-size:8.5px;color:#fff;text-shadow:2px 2px 0 var(--edge);padding:16px 2px 8px;text-transform:uppercase}
.quest{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--paper);border:3px solid var(--edge);margin-bottom:6px}
.quest .ck{width:28px;height:28px;border:3px solid var(--edge);background:#fff;display:grid;place-items:center;font-family:var(--pixel);font-size:10px}
.quest.done .ck{background:var(--green);color:#fff} .quest.done .qt{color:var(--dim);text-decoration:line-through}
.quest .rw{font-family:var(--pixel);font-size:8px;color:var(--coin2)}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.score div{background:var(--paper);border:3px solid var(--edge);padding:10px 8px;min-width:0;box-shadow:3px 3px 0 rgba(27,27,58,.85)}
.score span{display:block;font-family:var(--pixel);font-size:7.5px;color:var(--dim);margin-bottom:8px}
.score b{display:block;font-size:25px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.month{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0}
.month b{font-family:var(--pixel);font-size:11px;text-transform:uppercase;color:#fff;text-shadow:2px 2px 0 var(--edge)}
.arrow{font-family:var(--pixel);font-size:13px;width:44px;height:40px;display:grid;place-items:center;background:var(--paper);border:3px solid var(--edge);box-shadow:3px 3px 0 rgba(27,27,58,.85)}
.empty{text-align:center;padding:26px 12px;background:rgba(255,255,255,.7);border:3px dashed var(--edge)}
.empty .px{font-size:11px;display:block;margin-bottom:10px;line-height:1.6}
.hiscore{text-align:center;margin-top:14px}
.hiscore .px{font-size:9px;color:var(--red)}
.hiscore b{display:block;font-size:56px;font-weight:400;color:var(--coin2);text-shadow:3px 3px 0 var(--edge);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;background:var(--paper);border:3px solid var(--edge);margin-bottom:6px}
.acc i{width:14px;height:14px;display:block;border:2px solid var(--edge)}
.acc b{font-weight:400;font-size:26px;white-space:nowrap}
.bars{display:grid;gap:12px}
.bar .lab{display:flex;justify-content:space-between;gap:10px;font-size:21px}
.bar{min-width:0}.bar .lab span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.bar .lab span:last-child{white-space:nowrap}
.track{height:18px;background:#fff;border:3px solid var(--edge);margin-top:4px}
.fill{height:100%}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:160px}
.col{display:grid;grid-template-columns:1fr 1fr;gap:3px;align-items:end;height:100%}
.col i{display:block;min-height:2px;border:2px solid var(--edge)}
.collab{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px;font-family:var(--pixel);font-size:7.5px;text-align:center;text-transform:uppercase}
.legend{display:flex;gap:16px;font-size:19px;margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;border:2px solid var(--edge)}
.note{font-size:19px;color:var(--ink);margin-top:8px}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.badge{background:var(--paper);border:3px solid var(--edge);padding:10px 6px;text-align:center;display:grid;gap:6px;justify-items:center}
.badge em{font-style:normal;font-size:30px;line-height:1}
.badge b{font-family:var(--pixel);font-size:7px;line-height:1.5;font-weight:400}
.badge span{font-size:16px;color:var(--dim)}
.badge.lock{opacity:.45;filter:grayscale(1)} .badge.got{background:#FFF3B8}
/* chão + blocos */
.ground{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--grass) 0 12px,var(--edge) 12px 15px,var(--dirt) 15px);background-size:100% 100%;border-top:4px solid var(--edge)}
.ground::after{content:"";position:absolute;inset:15px 0 0;background-image:radial-gradient(var(--dirt2) 2px,transparent 3px);background-size:22px 18px;pointer-events:none;opacity:.6}
.ground .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative;z-index:1;padding-top:8px}
.block{font-family:var(--pixel);font-size:11px;padding:18px 6px;border:4px solid var(--edge);box-shadow:inset -5px -5px 0 rgba(0,0,0,.18),inset 5px 5px 0 rgba(255,255,255,.35),4px 4px 0 var(--edge);text-transform:uppercase;position:relative}
.block.buy{background:var(--red);color:#fff} .block.get{background:var(--coin);color:var(--ink)}
.block.bump{animation:bump .25s steps(3)}
@keyframes bump{50%{transform:translateY(-10px)}}
/* folha */
#scrim{position:fixed;inset:0;background:rgba(27,27,58,.55);z-index:40}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:94vh;overflow-y:auto;background:var(--paper);border-top:4px solid var(--edge);
  padding:16px max(14px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));overscroll-behavior:contain}
#sheet .in{max-width:540px;margin:0 auto;display:grid;gap:14px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shead b{font-family:var(--pixel);font-size:12px;line-height:1.4}
.x{font-family:var(--pixel);font-size:11px;padding:10px 12px;border:3px solid var(--edge);background:#fff}
.amount{font-size:60px;text-align:center}
.lbl{font-family:var(--pixel);font-size:8.5px;color:var(--dim);margin-bottom:8px;display:block;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:21px;padding:6px 10px;background:#fff;border:3px solid var(--edge);box-shadow:3px 3px 0 rgba(27,27,58,.85);white-space:nowrap}
.chip.on{background:var(--coin)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.save{font-family:var(--pixel);font-size:13px;padding:18px;width:100%;border:4px solid var(--edge);box-shadow:4px 4px 0 rgba(27,27,58,.85);background:var(--green);color:#fff}
.del{font-family:var(--pixel);font-size:10px;padding:14px;width:100%;border:3px solid var(--red);color:var(--red);background:transparent}
/* efeitos */
#toast{position:fixed;left:50%;top:calc(130px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:95;font-family:var(--pixel);font-size:10px;padding:12px 14px;background:#fff;border:4px solid var(--edge);box-shadow:4px 4px 0 rgba(27,27,58,.85);max-width:min(92vw,460px);text-align:center;line-height:1.6}
.pop{position:fixed;z-index:96;font-family:var(--pixel);font-size:14px;color:var(--coin);text-shadow:2px 2px 0 var(--edge);pointer-events:none;animation:pop 1s steps(8) forwards}
@keyframes pop{to{transform:translateY(-70px);opacity:0}}
.coinfly{position:fixed;z-index:96;width:18px;height:22px;background:var(--coin);border:3px solid var(--edge);border-radius:40%;pointer-events:none;animation:coin .7s steps(7) forwards}
@keyframes coin{0%{transform:translateY(0) scaleX(1)}40%{transform:translateY(-80px) scaleX(.3)}70%{transform:translateY(-110px) scaleX(1)}100%{transform:translateY(-60px);opacity:0}}
#levelup{position:fixed;inset:0;z-index:97;display:grid;place-items:center;background:rgba(27,27,58,.7);text-align:center;padding:20px}
#levelup .card{background:var(--paper);border:4px solid var(--edge);padding:24px;box-shadow:6px 6px 0 var(--edge)}
#levelup .px{font-size:20px;color:var(--red);line-height:1.5}
.sync{font-family:var(--pixel);font-size:8px;color:var(--ink);background:rgba(255,255,255,.75);padding:4px 6px;display:inline-flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;background:var(--dim);display:inline-block}
.dot.ok{background:var(--green)} .dot.busy{background:var(--coin)} .dot.err{background:var(--red)}
.setup{margin-top:40px;display:grid;gap:14px}
@media (prefers-reduced-motion: reduce){.hero canvas,.cloud,.block.bump{animation:none}.pop,.coinfly{animation-duration:.01s}}
@media (max-width:370px){.score b{font-size:21px}.block{font-size:9px}.hiscore b{font-size:44px}.tabs button{font-size:7px}}
</style>
</head>
<body>
<div class="clouds" aria-hidden="true"><i class="cloud" style="top:12%;animation-duration:70s"></i><i class="cloud" style="top:34%;animation-duration:95s;animation-delay:-40s"></i><i class="cloud" style="top:58%;animation-duration:80s;animation-delay:-20s"></i></div>
<div class="wrap">
  <header id="hdr" hidden>
    <button class="hud" data-act="trophies" aria-label="Nível e conquistas">
      <span class="lvl" id="h_lvl">LV 1</span>
      <span class="xp"><span class="t" id="h_title">NOVATO</span><span class="xpbar"><i id="h_xp" style="width:0%"></i></span></span>
      <span class="stat" id="h_streak">🔥0</span>
      <span class="stat" id="h_coins">🪙0</span>
    </button>
    <nav class="tabs" aria-label="Separadores">
      <button data-tab="jogo" class="on">JOGO</button><button data-tab="lista">LISTA</button><button data-tab="saldo">SALDO</button><button data-tab="grafico">GRÁFICO</button>
    </nav>
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="sync" id="sync"><span class="dot"></span><span>—</span></span><button class="btn small alt" data-act="refresh">⟳ ATUALIZAR</button></div>
  </header>
  <main id="main"></main>
</div>
<div class="ground" id="ground" hidden><div class="in">
  <button class="block buy" data-act="add" data-type="out">− Compra</button>
  <button class="block get" data-act="add" data-type="in">+ Recebi</button>
</div></div>
<div id="scrim" hidden></div>
<div id="sheet" hidden role="dialog" aria-modal="true"><div class="in" id="sheetin"></div></div>
<div id="toast" hidden></div>
<div id="levelup" hidden></div>

<script>
"use strict";
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EUR=new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR"});
const EUR0=new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const fmt=c=>EUR.format((c||0)/100), fmt0=c=>EUR0.format(Math.round((c||0)/100));
const pad=n=>String(n).padStart(2,"0");
const isoD=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>isoD(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return isoD(d)};
const diffDays=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const nowTime=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const ymOf=s=>String(s||"").slice(0,7);
const addMonths=(ym,n)=>{let[y,m]=ym.split("-").map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return`${y}-${pad(m)}`};
const daysIn=ym=>{const[y,m]=ym.split("-").map(Number);return new Date(y,m,0).getDate()};
const MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MES3=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const SEM=["dom","seg","ter","qua","qui","sex","sáb"];
const monthLabel=ym=>{const[y,m]=ym.split("-").map(Number);return MES[m-1]+" "+y};
const dayLabel=s=>s===today()?"Hoje":s===addDays(today(),-1)?"Ontem":(d=>`${SEM[d.getDay()]} ${d.getDate()} ${MES3[d.getMonth()]}`)(new Date(s+"T12:00:00"));
const weekStart=s=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()-(d.getDay()+6)%7);return isoD(d)};
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const genId=p=>(p||"t")+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function parseAmt(v){if(typeof v==="number")return Math.round(Math.abs(v)*100);let s=String(v||"").replace(/[^\d,.]/g,"");if(!s)return 0;const dec=Math.max(s.lastIndexOf(","),s.lastIndexOf("."));let n;
  if(dec>=0&&s.length-dec-1<=2&&s.length-dec-1>0)n=parseFloat(s.slice(0,dec).replace(/[.,]/g,"")+"."+s.slice(dec+1));else n=parseFloat(s.replace(/[.,]/g,""));return isFinite(n)?Math.round(n*100):0}
const toInput=c=>c?(c/100).toFixed(2).replace(".",","):"";

  else if(a==="prev"){S.month=addMonths(S.month,-1);render()}else if(a==="next"){S.month=addMonths(S.month,1);render()}
  else if(a==="acc"){const c=S.accounts.get(el.dataset.id);openSheet(`<div class="shead"><b>${esc(c.name)}</b><button class="x" data-act="close">X</button></div>
    <div class="board"><span class="lbl">Saldo na Carteira</span><div style="font-size:40px">${fmt(balance(c.id))}</div></div><div><span class="lbl">Saldo real no banco</span><input id="real" inputmode="decimal" placeholder="0,00 €"></div>
    <button class="save" data-act="fix" data-id="${esc(c.id)}">ACERTAR SALDO</button><div class="note">A diferença fica registada como acerto e não conta como compra nem recebimento.</div>`)}
  else if(a==="fix"){const id=el.dataset.id,v=$("#real").value.trim();if(!v){toast("ESCREVE O SALDO");return}const diff=parseAmt(v)*(/^\s*[-−]/.test(v)?-1:1)-balance(id);closeSheet();if(!diff){toast("JÁ ESTÁ CERTO");return}
    const row=toRow({id:genId("a"),type:"adjust",amt:Math.abs(diff),date:today(),time:nowTime(),place:"Acerto de saldo",acc:id,src:"manual",created:Date.now()});row.valor=+(diff/100).toFixed(2);send({a:"put",row});toast("SALDO ACERTADO")}
  else if(a==="connect"){const u=$("#apiurl").value.trim();if(!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec/.test(u)){toast("ESSE LINK NÃO ACABA EM /exec");return}S.api=u;LS.set("api",u);render();refresh(true)}
  else if(a==="disconnect"){if(!el.dataset.arm){el.dataset.arm=1;el.textContent="TOCA OUTRA VEZ PARA DESLIGAR";return}LS.set("api","");LS.set("cache",null);S.api="";S.ready=false;closeSheet();render()}
});
document.addEventListener("change",e=>{if(e.target.id==="f_place"&&S.form&&!S.form.id){const n=norm(e.target.value);const hit=flows().filter(t=>t.type===S.form.type&&norm(t.place)===n).sort((a,b)=>b.created-a.created)[0];
  if(hit){S.form.cat=hit.cat;S.form.acc=hit.acc||S.form.acc;S.form.method=hit.method||S.form.method}else if(!S.form.cat)S.form.cat=guessCat(e.target.value,S.form.type);
  document.querySelectorAll("#sheet .chip[data-k]").forEach(c=>c.classList.toggle("on",S.form[c.dataset.k]===c.dataset.v))}}); // atualiza sem redesenhar (não perde o toque em GUARDAR)
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet();if(e.key==="Enter"&&e.target.id==="qtext"){e.preventDefault();quick(null)}else if(e.key==="Enter"&&S.form&&e.target.tagName==="INPUT"){e.preventDefault();save(null)}});
$("#scrim").addEventListener("click",closeSheet);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.api)refresh(false)});
window.addEventListener("online",flush);
setInterval(()=>{const cv=$("#pig");if(cv&&$("#sheet").hidden)drawPig(cv,mood())},4000);

/* arranque: mostra logo a cópia guardada, depois atualiza da folha */
const cache=LS.get("cache",null);if(S.api&&cache){load(cache);S.ready=true}
render();if(S.api)refresh(false);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
